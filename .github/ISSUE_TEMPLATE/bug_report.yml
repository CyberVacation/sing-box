name: Bug report
description: Report a Rostra issue
body:
  - type: textarea
    attributes:
      label: Operating system and version
      description: For example, Linux / Windows / macOS and its version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Installation method
      description: Source build, Rostra package, Docker, or another method.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Rostra version
      description: Provide the complete output of rostra version.
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and minimal configuration
      description: Provide reproducible steps and a minimal configuration. Remove passwords, keys, and tokens.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Include relevant logs with sensitive information removed.
      render: shell
    validations:
      required: false
