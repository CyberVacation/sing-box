name: 问题报告
description: 报告 Rostra 问题
body:
  - type: textarea
    attributes:
      label: 操作系统和版本
      description: 例如 Linux / Windows / macOS 及版本。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 安装方式
      description: 例如源码构建、Rostra 软件包或 Docker。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Rostra 版本
      description: 请提供 rostra version 的完整输出。
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请描述预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤和最小配置
      description: 请提供可复现的步骤及最小配置，移除密码、密钥和令牌。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志
      description: 请提供相关日志，并移除敏感信息。
      render: shell
    validations:
      required: false
